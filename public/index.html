<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#234232" />
  <title>Botanical Note · 잎사귀 노트</title>
  <style>
    :root {
      --bg-ivory: #f6f3ea;
      --bg-card: #FFFFFF;
      --bg-soft: #ebe6d8;
      --green-deep: #6E7FE6;
      --green-mid: #3a634b;
      --green-light: #e3ece5;
      --text-main: #1f2a24;
      --text-sub: #5c6b62;
      --border-soft: #dcd6c6;
      --danger: #b84238;
      --danger-bg: #fceae8;
      --shadow-soft: 0 8px 24px rgba(110, 127, 230, 0.08);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; min-height: 100%;
      background-color: #e8e2d3; color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      line-height: 1.5;
    }
    .app-shell {
      max-width: 480px; min-height: 100dvh; margin: 0 auto;
      background-color: var(--bg-ivory); position: relative;
      display: flex; flex-direction: column;
      box-shadow: 0 0 40px rgba(30, 36, 51, 0.12);
    }
    .splash-screen {
      position: fixed; inset: 0; max-width: 480px; margin: 0 auto;
      background: linear-gradient(170deg, #f8f5ec 0%, #e9efe9 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 900;
      padding: calc(24px + var(--safe-top)) 24px calc(24px + var(--safe-bottom));
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    .splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-title { margin: 18px 0 14px; font-size: 26px; font-weight: 700; letter-spacing: 0.4px; color: var(--green-deep); }
    .splash-spinner {
      width: 24px; height: 24px;
      border: 2.5px solid rgba(110, 127, 230, 0.18);
      border-top-color: var(--green-mid); border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .top-bar {
      position: sticky; top: 0; z-index: 40;
      background: rgba(238, 241, 255, 0.95); backdrop-filter: blur(10px);
      padding: calc(14px + var(--safe-top)) 20px 14px;
      border-bottom: 1px solid var(--border-soft);
      display: flex; align-items: center; justify-content: space-between;
      min-height: calc(56px + var(--safe-top));
    }
    .top-title { margin: 0; font-size: 20px; font-weight: 700; color: var(--green-deep); letter-spacing: -0.3px; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .btn-ghost {
      background: var(--bg-soft); color: var(--green-deep); border: none;
      border-radius: 10px; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-ghost.danger { background: var(--danger-bg); color: var(--danger); }
    .main-content {
      flex: 1; padding: 18px 18px calc(92px + var(--safe-bottom));
      display: flex; flex-direction: column; gap: 16px;
    }
    .capture-hero {
      background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: 20px;
      padding: 20px 16px; box-shadow: var(--shadow-soft);
      display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px;
    }
    .preview-frame {
      width: 100%; aspect-ratio: 4 / 3; border-radius: 16px;
      background: var(--bg-soft); border: 1.5px dashed #b9b2a1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
    }
    .preview-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .preview-placeholder { padding: 18px; color: var(--text-sub); font-size: 14px; }
    .capture-buttons { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-primary {
      background: var(--green-deep); color: #fff; border: none; border-radius: 14px;
      padding: 14px 12px; font-size: 15px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      box-shadow: 0 4px 12px rgba(110, 127, 230, 0.18);
    }
    .btn-secondary {
      background: var(--green-light); color: var(--green-deep); border: 1px solid #c3d5c7;
      border-radius: 14px; padding: 14px 12px; font-size: 15px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 7px;
    }
    .info-card {
      background: var(--bg-card); border: 1px solid var(--border-soft);
      border-radius: 18px; padding: 16px; box-shadow: var(--shadow-soft);
    }
    .info-card h3 { margin: 0 0 6px; font-size: 15px; color: var(--green-deep); }
    .info-card p { margin: 0; font-size: 13.5px; color: var(--text-sub); }
    .loading-overlay {
      position: fixed; inset: 0; max-width: 480px; margin: 0 auto;
      background: rgba(245, 246, 251, 0.96); backdrop-filter: blur(8px);
      z-index: 800; display: none; flex-direction: column;
      align-items: center; justify-content: flex-start; gap: 16px; padding: 120px 24px 24px;
    }
    .loading-overlay.active { display: flex; }
    .leaves-stage { display: flex; align-items: center; justify-content: center; gap: 18px; height: 84px; }
    .leaf-item { opacity: 0; animation: leafAppearSway 1.5s ease-in-out infinite; }
    .leaf-item:nth-child(1) { animation-delay: 0s; }
    .leaf-item:nth-child(2) { animation-delay: 0.25s; }
    .leaf-item:nth-child(3) { animation-delay: 0.5s; }
    @keyframes leafAppearSway {
      0% { opacity: 0; transform: translateY(10px) rotate(-14deg) scale(0.88); }
      25% { opacity: 1; transform: translateY(0px) rotate(8deg) scale(1); }
      55% { opacity: 1; transform: translateY(-3px) rotate(-9deg) scale(1.02); }
      85% { opacity: 0.9; transform: translateY(2px) rotate(6deg) scale(0.98); }
      100% { opacity: 0; transform: translateY(10px) rotate(-14deg) scale(0.88); }
    }
    .loading-text { font-size: 15px; font-weight: 600; color: var(--green-deep); text-align: center; }
    .result-photo {
      width: 100%; max-height: 280px; object-fit: cover;
      border-radius: 16px; border: 1px solid var(--border-soft); display: block;
    }
    .meta-strip { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12.5px; color: var(--text-sub); }
    .meta-badge { background: var(--bg-soft); padding: 5px 10px; border-radius: 999px; color: var(--green-deep); font-weight: 500; }
    .plant-name-ko { margin: 0; font-size: 22px; font-weight: 700; color: var(--green-deep); }
    .plant-name-la { margin: 2px 0 10px; font-size: 14px; font-style: italic; color: var(--green-mid); }
    .plant-desc { margin: 0; font-size: 14.5px; color: var(--text-main); white-space: pre-line; }
    .ref-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
    .ref-tile {
      aspect-ratio: 1 / 1; border-radius: 10px; overflow: hidden;
      background: var(--bg-soft); border: 1px solid var(--border-soft);
      display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 10.5px; color: var(--text-sub); padding: 4px;
    }
    .ref-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .action-row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin-top: 4px; }
    .delete-bar {
      background: var(--danger-bg); border: 1px solid #f0c5c0; border-radius: 14px;
      padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
      gap: 8px; font-size: 13.5px; color: var(--danger); font-weight: 600;
    }
    .btn-danger { background: var(--danger); color: #fff; border: none; border-radius: 10px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .diary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .diary-thumb {
      aspect-ratio: 1 / 1; border-radius: 10px; overflow: hidden; position: relative;
      background: var(--bg-soft); border: 1px solid var(--border-soft); cursor: pointer;
    }
    .diary-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .diary-check { position: absolute; top: 5px; right: 5px; width: 20px; height: 20px; accent-color: var(--danger); cursor: pointer; }
    .empty-state {
      text-align: center; padding: 48px 20px; color: var(--text-sub);
      background: var(--bg-card); border-radius: 18px; border: 1px solid var(--border-soft);
    }
    .comment-list { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
    .comment-item { background: var(--bg-soft); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
    .comment-time { display: block; font-size: 11px; color: var(--text-sub); margin-top: 4px; }
    .comment-form { display: flex; gap: 8px; }
    .input-field {
      width: 100%; padding: 11px 13px; border-radius: 12px;
      border: 1px solid var(--border-soft); background: #fff; font-size: 14px; color: var(--text-main);
    }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; }
    .setting-label { font-size: 15px; font-weight: 600; color: var(--text-main); }
    .setting-sub { font-size: 12.5px; color: var(--text-sub); margin-top: 2px; }
    .switch { position: relative; display: inline-block; width: 48px; height: 28px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #c8c3b6; transition: 0.25s; border-radius: 28px; }
    .slider:before {
      position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px;
      background-color: white; transition: 0.25s; border-radius: 50%; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .switch input:checked + .slider { background-color: var(--green-mid); }
    .switch input:checked + .slider:before { transform: translateX(20px); }
    .copyright-footer { margin-top: auto; padding-top: 20px; text-align: center; font-size: 12px; color: var(--text-sub); }
    .bottom-tabbar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px; background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px); border-top: 1px solid var(--border-soft);
      display: grid; grid-template-columns: repeat(3, 1fr);
      padding: 8px 0 calc(8px + var(--safe-bottom)); z-index: 50;
    }
    .tab-btn {
      background: none; border: none; padding: 6px 4px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 11px; font-weight: 600; color: var(--text-sub); cursor: pointer;
    }
    .tab-btn.active { color: var(--green-deep); }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(24, 30, 46, 0.45);
      z-index: 950; display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-backdrop.active { display: flex; }
    .modal-box {
      width: 100%; max-width: 380px; background: var(--bg-card);
      border-radius: 20px; padding: 22px 20px; box-shadow: 0 14px 36px rgba(0, 0, 0, 0.2);
    }
    .modal-title { margin: 0 0 8px; font-size: 18px; font-weight: 700; color: var(--green-deep); }
    .modal-desc { margin: 0 0 14px; font-size: 13.5px; color: var(--text-sub); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  </style>
<style id="intro-splash-style">
  #introSplash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #6E7FE6;
    color: #FFFFFF;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 56px 24px 36px;
    opacity: 1;
    transition: opacity 0.45s ease, visibility 0.45s ease;
  }
  #introSplash.fade-out {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .intro-center {
    flex: 1;
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .intro-logo-box {
    width: 84px;
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
  }
  .intro-logo-box svg {
    width: 72px;
    height: 72px;
    stroke: #FFFFFF;
    fill: none;
    stroke-width: 3.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .intro-title {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #FFFFFF;
  }
  .intro-sub {
    margin: 6px 0 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    color: rgba(255, 255, 255, 0.88);
  }
  .intro-spinner-wrap {
    margin-top: 68px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .intro-spinner {
    position: relative;
    width: 34px;
    height: 34px;
  }
  .intro-spinner span {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 2.5px;
    height: 9px;
    margin-left: -1.25px;
    margin-top: -15px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.25);
    transform-origin: 50% 15px;
    animation: intro-ray-pulse 1.2s linear infinite;
  }
  .intro-spinner span:nth-child(1)  { transform: rotate(0deg);   animation-delay: -1.2s; }
  .intro-spinner span:nth-child(2)  { transform: rotate(30deg);  animation-delay: -1.1s; }
  .intro-spinner span:nth-child(3)  { transform: rotate(60deg);  animation-delay: -1.0s; }
  .intro-spinner span:nth-child(4)  { transform: rotate(90deg);  animation-delay: -0.9s; }
  .intro-spinner span:nth-child(5)  { transform: rotate(120deg); animation-delay: -0.8s; }
  .intro-spinner span:nth-child(6)  { transform: rotate(150deg); animation-delay: -0.7s; }
  .intro-spinner span:nth-child(7)  { transform: rotate(180deg); animation-delay: -0.6s; }
  .intro-spinner span:nth-child(8)  { transform: rotate(210deg); animation-delay: -0.5s; }
  .intro-spinner span:nth-child(9)  { transform: rotate(240deg); animation-delay: -0.4s; }
  .intro-spinner span:nth-child(10) { transform: rotate(270deg); animation-delay: -0.3s; }
  .intro-spinner span:nth-child(11) { transform: rotate(300deg); animation-delay: -0.2s; }
  .intro-spinner span:nth-child(12) { transform: rotate(330deg); animation-delay: -0.1s; }
  @keyframes intro-ray-pulse {
    0%   { background: #FFFFFF; }
    100% { background: rgba(255, 255, 255, 0.22); }
  }
  .intro-footer {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.92);
    text-align: center;
    letter-spacing: -0.01em;
  }
</style>
<style id="nonda-theme-override">
  body, .app-shell {
    background: #6E7FE6 !important;
  }

  /* 상단 헤더: 인트로와 동일한 #6E7FE6 블루 배경 + 화이트 텍스트 */
  header, .top-header, .app-header {
    background: #6E7FE6 !important;
    color: #FFFFFF !important;
    border-bottom: none !important;
    box-shadow: none !important;
  }

  header *, .top-header *, .app-header * {
    color: #FFFFFF !important;
  }

  .brand-badge, .logo-badge {
    background: rgba(255, 255, 255, 0.2) !important;
    color: #FFFFFF !important;
    box-shadow: none !important;
  }

  /* 메인 영역: 위쪽 모서리가 둥글게 올라오는 순백색 시트 */
  main, .main-content, #mainContent, .content-area {
    background: #FFFFFF !important;
    border-top-left-radius: 22px !important;
    border-top-right-radius: 22px !important;
    min-height: calc(100dvh - 60px);
    padding-top: 20px !important;
  }

  /* 내부 카드 & 입력창: 깨끗한 화이트/연쿨그레이 톤 */
  .info-card, .diary-card, .result-card, .upload-card, .filter-card, .card {
    background: #FFFFFF !important;
    border: 1px solid #ECEEF6 !important;
    box-shadow: 0 2px 10px rgba(34, 42, 66, 0.04) !important;
  }

  input[type="text"], input[type="search"], textarea, select, .input-field {
    background: #F6F7FB !important;
    border: 1px solid #E3E6F2 !important;
    color: #222634 !important;
  }

  input:focus, textarea:focus, select:focus, .input-field:focus {
    background: #FFFFFF !important;
    border-color: #6E7FE6 !important;
    box-shadow: 0 0 0 3px rgba(110, 127, 230, 0.14) !important;
  }

  /* 메인 버튼 & 포인트 텍스트 */
  .btn-primary, button.primary {
    background: #6E7FE6 !important;
    color: #FFFFFF !important;
    border: none !important;
  }

  .btn-primary:hover, button.primary:hover {
    background: #5C6ED8 !important;
  }

  .btn-secondary, .btn-ghost {
    background: #F0F2FC !important;
    color: #6E7FE6 !important;
    border: 1px solid #DFE4FA !important;
  }

  /* 하단 탭바: 흰색 배경 + 활성 탭만 #6E7FE6 블루 포인트 */
  nav, .bottom-nav, .tab-bar {
    background: #FFFFFF !important;
    border-top: 1px solid #ECEEF5 !important;
    box-shadow: 0 -2px 10px rgba(34, 42, 66, 0.04) !important;
  }

  nav button, .bottom-nav button, .nav-btn, .tab-btn {
    background: transparent !important;
    color: #C2C6D4 !important;
  }

  nav button.active, .bottom-nav button.active, .nav-btn.active, .tab-btn.active,
  nav button[aria-selected="true"], .bottom-nav button[aria-selected="true"] {
    background: transparent !important;
    color: #6E7FE6 !important;
  }

  nav button.active svg, .bottom-nav button.active svg, .nav-btn.active svg, .tab-btn.active svg {
    stroke: #6E7FE6 !important;
    color: #6E7FE6 !important;
  }

  /* 토글 스위치 */
  input:checked + .slider {
    background: #6E7FE6 !important;
  }
</style>
<style id="upload-guide-color-sync">
  /* 앨범올리기창(업로드 박스/드롭존) 기준 배경색 */
  .upload-card, .upload-box, .dropzone, .album-upload, .photo-upload-box {
    background: #F6F7FB !important;
    border-color: #DFE4FA !important;
  }

  /* 사진을 올려보라는 안내 창/박스도 앨범올리기창과 동일한 배경색으로 통일 */
  .upload-guide, .photo-guide, .guide-box, .empty-guide, .upload-hint-box,
  [class*="upload"] [class*="guide"], [class*="upload"] [class*="empty"],
  [class*="photo"] [class*="guide"], [class*="album"] [class*="guide"] {
    background: #F6F7FB !important;
    border-color: #DFE4FA !important;
  }
</style>

<style id="meta-pill-bg-style">
  .meta-pill-box,
  .meta-pill-box * {
    color: #1D2242 !important;
  }
  .meta-pill-box {
    background-color: #F4F5FD !important;
    border-color: #E2E5F7 !important;
    color: #1D2242 !important;
  }
  .meta-pill-inner {

  }
</style>
<style id="meta-badge-exact-style">
  .meta-badge,
  span.meta-badge {
    background-color: #F4F5FD !important;
    background: #F4F5FD !important;
    color: #1D2242 !important;
    border-color: #E2E5F7 !important;
  }

  }
</style>

<style id="register-and-comment-style">
  /* 댓글/메모 입력창(.comment-form .input-field) 및 댓글 목록 항목 배경을 연한 라벤더(#F4F5FD)로 통일 */
  .comment-form .input-field,
  .comment-form input,
  .comment-form textarea {
    background: #F4F5FD !important;
    background-color: #F4F5FD !important;
    border-color: #DDE2F6 !important;
    color: #1D2242 !important;
  }

  <script>
    (() => {
      const STORAGE_KEYS = {
        API_KEY: 'botanical_note_gemini_api_key_v1',
        SETTINGS: 'botanical_note_settings_v1'
      };
      const DB_NAME = 'BotanicalNoteDB';
      const DB_VERSION = 1;
      const STORE_NAME = 'entries';

      const state = {
        view: 'browse',
        previewUrl: '',
        previewBase64: '',
        previewMimeType: 'image/jpeg',
        analysisResult: null,
        referencePhotos: [],
        entries: [],
        selectedEntryId: null,
        deleteMode: false,
        selectedIds: new Set(),
        settings: loadSettings()
      };

      function loadSettings() {
        try {
          const raw = localStorage.getItem(STORAGE_KEYS.SETTINGS);
          if (raw) {
            const parsed = JSON.parse(raw);
            return {
              recordDate: parsed.recordDate !== false,
              recordLocation: parsed.recordLocation !== false,
              userName: typeof parsed.userName === "string" ? parsed.userName.trim() : "",
              namePromptShown: !!parsed.namePromptShown
            };
          }
        } catch (_) {}
        return { recordDate: true, recordLocation: true, userName: "", namePromptShown: false };
      }

      function saveSettings(next) {
        state.settings = { ...next };
        try { localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify(state.settings)); } catch (e) {}
      }

      function getApiKey() {
        return "SERVER_PROXY_MODE";
      }

      function setApiKey(key) {
        try { localStorage.setItem(STORAGE_KEYS.API_KEY, key.trim()); } catch (e) {}
      }

      function openDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
              store.createIndex('createdAt', 'createdAt', { unique: false });
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function fetchAllEntries() {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.getAll();
          req.onsuccess = () => {
            const list = req.result || [];
            list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            resolve(list);
          };
          req.onerror = () => reject(req.error);
        });
      }

      async function saveEntryToDB(entry) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).put(entry);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      }

      async function deleteEntriesFromDB(ids) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          ids.forEach((id) => store.delete(id));
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      }

      let audioCtx = null;
      function ensureAudioContext() {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return null;
          if (!audioCtx) audioCtx = new Ctx();
          if (audioCtx && audioCtx.state === "suspended" && typeof audioCtx.resume === "function") {
            audioCtx.resume().catch(() => {});
          }
          return audioCtx;
        } catch (_) {
          return null;
        }
      }

      function playLeafRustleSound() {
        const ctx = ensureAudioContext();
        if (!ctx) return;
        try {
          const duration = 0.85;
          const sampleRate = ctx.sampleRate;
          const frameCount = Math.floor(sampleRate * duration);
          const buffer = ctx.createBuffer(1, frameCount, sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < frameCount; i++) {
            const t = i / sampleRate;
            const pulse1 = Math.pow(Math.max(0, Math.sin(t * Math.PI * 7)), 4);
            const pulse2 = Math.pow(Math.max(0, Math.sin(t * Math.PI * 11 + 0.8)), 5);
            const fadeOut = 1 - t / duration;
            const crinkle = (Math.random() * 2 - 1) * (0.25 + 0.75 * Math.random());
            data[i] = crinkle * (0.25 + 0.75 * Math.max(pulse1, pulse2)) * fadeOut;
          }
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          const bandpass = ctx.createBiquadFilter();
          bandpass.type = 'bandpass';
          bandpass.frequency.setValueAtTime(2900, ctx.currentTime);
          bandpass.Q.setValueAtTime(1.1, ctx.currentTime);
          const highpass = ctx.createBiquadFilter();
          highpass.type = 'highpass';
          highpass.frequency.setValueAtTime(950, ctx.currentTime);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.001, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.32, ctx.currentTime + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
          noise.connect(bandpass);
          bandpass.connect(highpass);
          highpass.connect(gain);
          gain.connect(ctx.destination);
          noise.start();
          noise.stop(ctx.currentTime + duration);
        } catch (_) {}
      }

      const modalBackdrop = document.getElementById('modalBackdrop');
      const modalBox = document.getElementById('modalBox');

      function closeModal() {
        modalBackdrop.classList.remove('active');
        modalBox.innerHTML = '';
      }

      function showAlertModal(title, message, onConfirm) {
        modalBox.innerHTML = `
          <h3 class="modal-title">${escapeHtml(title)}</h3>
          <p class="modal-desc">${escapeHtml(message)}</p>
          <div class="modal-actions">
            <button type="button" class="btn-primary" id="modalConfirmBtn">확인</button>
          </div>
        `;
        modalBackdrop.classList.add('active');
        document.getElementById('modalConfirmBtn').addEventListener('click', () => {
          closeModal();
          if (typeof onConfirm === 'function') onConfirm();
        });
      }

      function showApiKeyModal(onSaved) {
        const currentKey = getApiKey();
        modalBox.innerHTML = `
          <h3 class="modal-title">Gemini API 키 설정</h3>
          <p class="modal-desc">식물 사진 판정을 위해 Google Gemini API 키가 필요해요. 입력한 키는 내 브라우저(localStorage)에만 저장됩니다.</p>
          <input type="password" class="input-field" id="apiKeyInput" placeholder="AIza..." value="${escapeAttr(currentKey)}" />
          <div class="modal-actions">
            <button type="button" class="btn-ghost" id="cancelApiKeyBtn">취소</button>
            <button type="button" class="btn-primary" id="saveApiKeyBtn">저장하기</button>
          </div>
        `;
        modalBackdrop.classList.add('active');
        document.getElementById('cancelApiKeyBtn').addEventListener('click', closeModal);
        document.getElementById('saveApiKeyBtn').addEventListener('click', () => {
          const val = document.getElementById('apiKeyInput').value.trim();
          if (!val) {
            showAlertModal('안내', '올바른 Gemini API 키를 입력해 주세요.');
            return;
          }
          setApiKey(val);
          closeModal();
          if (typeof onSaved === 'function') onSaved(val);
        });
      }

      function formatNowKorean() {
        const now = new Date();
        return now.toLocaleString('ko-KR', {
          year: 'numeric', month: 'long', day: 'numeric',
          weekday: 'short', hour: '2-digit', minute: '2-digit'
        });
      }

      async function reverseGeocodePlaceName(lat, lon) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 2500);
        try {
          const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=16&addressdetails=1&accept-language=ko`;
          const resp = await fetch(url, {
            signal: controller.signal,
            headers: { "Accept": "application/json" }
          });
          if (!resp.ok) return "";
          const data = await resp.json();
          const addr = data && data.address ? data.address : {};
          const parts = [
            addr.province || addr.state || addr.city || "",
            addr.city !== (addr.province || addr.state) ? (addr.city || "") : "",
            addr.borough || addr.county || addr.district || "",
            addr.neighbourhood || addr.suburb || addr.quarter || addr.road || ""
          ].filter((v, idx, arr) => v && arr.indexOf(v) === idx);

          if (parts.length > 0) {
            return parts.join(" ");
          }
          if (data && data.display_name) {
            return String(data.display_name).split(",").slice(0, 3).map((s) => s.trim()).filter(Boolean).join(" ");
          }
          return "";
        } catch (_) {
          return "";
        } finally {
          clearTimeout(timer);
        }
      }

      function getCurrentLocationText() {
        return new Promise((resolve) => {
          if (!navigator.geolocation) {
            resolve('위치 정보 미지원 기기');
            return;
          }
          navigator.geolocation.getCurrentPosition(
            async (pos) => {
              const lat = pos.coords.latitude;
              const lon = pos.coords.longitude;
              const coordText = `위도 ${lat.toFixed(4)}, 경도 ${lon.toFixed(4)}`;
              const placeName = await reverseGeocodePlaceName(lat, lon);
              resolve(placeName ? `${placeName} (${coordText})` : coordText);
            },
            () => resolve('위치 권한 꺼짐 또는 확인 불가'),
            { enableHighAccuracy: true, timeout: 6000, maximumAge: 60000 }
          );
        });
      }

      function readImageFile(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              const maxSide = 768;
              let { width, height } = img;
              if (width > maxSide || height > maxSide) {
                if (width > height) {
                  height = Math.round((height * maxSide) / width);
                  width = maxSide;
                } else {
                  width = Math.round((width * maxSide) / height);
                  height = maxSide;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              const dataUrl = canvas.toDataURL('image/jpeg', 0.78);
              const base64 = dataUrl.split(',')[1] || '';
              resolve({ dataUrl, base64, mimeType: 'image/jpeg' });
            };
            img.onerror = reject;
            img.src = reader.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      async function identifyPlantWithGemini(apiKey, base64Data, mimeType) {
        const models = ["gemini-3.5-flash-lite", "gemini-2.5-flash"];
        const loadingText = document.getElementById("loadingText");
        const promptText = [
          "당신은 식물학 백과사전 전문가입니다. 첨부된 사진 속 식물을 판별하고 아래 JSON 스키마로만 응답하세요.",
          "- name_ko: 한국어 일반 식물 이름",
          "- scientific_name: 라틴어 학명",
          "- english_name: 영어 일반명 또는 검색용 영문명",
          "- description: 잎, 꽃, 줄기/서식지, 비슷한 식물과의 구별 포인트를 백과사전식으로 알기 쉽게 정리한 한국어 설명"
        ].join("\n");

        const payload = JSON.stringify({
          contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: mimeType, data: base64Data } }] }],
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: {
                name_ko: { type: "STRING" },
                scientific_name: { type: "STRING" },
                english_name: { type: "STRING" },
                description: { type: "STRING" }
              },
              required: ["name_ko", "scientific_name", "english_name", "description"]
            }
          }
        });

        let lastError = null;
        const delays = [900, 1600, 2600, 4000, 6000];

        for (let round = 0; round < 2; round++) {
          for (const model of models) {
            const endpoint = "/api/identify";

            for (let attempt = 0; attempt <= delays.length; attempt++) {
              if (loadingText) {
                loadingText.textContent = attempt === 0 && round === 0
                  ? ("식물 특징을 살펴보는 중... (" + model + ")")
                  : ("서버 응답을 다시 요청하는 중... (" + model + ")");
              }

              try {
                const response = await fetch(endpoint, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ model, payload })
                });

                if (response.ok) {
                  const data = await response.json();
                  const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
                  const cleaned = rawText.replace(/^```json\s*/i, "").replace(/```$/i, "").trim();
                  const parsed = JSON.parse(cleaned);
                  return {
                    nameKo: (parsed.name_ko || "이름 미확인 식물").trim(),
                    scientificName: (parsed.scientific_name || "Species indeterminata").trim(),
                    englishName: (parsed.english_name || parsed.scientific_name || "plant").trim(),
                    description: (parsed.description || "상세 특징 정보가 제공되지 않았습니다.").trim()
                  };
                }

                const errText = await response.text();
                lastError = new Error("Gemini API 오류 (" + response.status + " · " + model + "): " + errText.slice(0, 180));

                if (response.status === 503 || response.status === 429 || response.status === 500 || response.status === 502 || response.status === 504) {
                  const waitTime = delays[Math.min(attempt, delays.length - 1)] + Math.floor(Math.random() * 450);
                  await new Promise((r) => setTimeout(r, waitTime));
                  if (attempt >= 2) break;
                  continue;
                }

                if (response.status === 404) {
                  break;
                }

                throw lastError;
              } catch (netErr) {
                lastError = netErr;
                const waitTime = delays[Math.min(attempt, delays.length - 1)] + 250;
                await new Promise((r) => setTimeout(r, waitTime));
                if (attempt >= 2) break;
              }
            }
          }
        }

        throw lastError || new Error("잠시 후 다시 시도해 주세요.");
      }

      async function fetchReferencePhotos(scientificName, englishName, koreanName) {
        const queries = [scientificName, englishName, koreanName].filter(Boolean);
        const collected = [];
        const seenUrls = new Set();

        for (const q of queries) {
          if (collected.length >= 4) break;
          try {
            const url = `https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=12&gsrsearch=${encodeURIComponent(q + ' filetype:bitmap')}&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=400`;
            const res = await fetch(url);
            if (!res.ok) continue;
            const json = await res.json();
            const pages = json?.query?.pages ? Object.values(json.query.pages) : [];
            for (const page of pages) {
              if (collected.length >= 4) break;
              const info = page?.imageinfo?.[0];
              const thumbUrl = info?.thumburl || info?.url;
              if (!thumbUrl) continue;
              const lower = thumbUrl.toLowerCase();
              if (lower.endsWith('.svg') || lower.endsWith('.tif') || lower.endsWith('.tiff')) continue;
              if (seenUrls.has(thumbUrl)) continue;
              seenUrls.add(thumbUrl);
              collected.push({ src: thumbUrl, title: (page.title || '').replace(/^File:/i, '') });
            }
          } catch (_) {}
        }

        if (collected.length < 4 && (scientificName || englishName)) {
          try {
            const wikiTitle = encodeURIComponent((scientificName || englishName).trim().replace(/\s+/g, '_'));
            const wikiRes = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${wikiTitle}`);
            if (wikiRes.ok) {
              const wikiJson = await wikiRes.json();
              const thumb = wikiJson?.thumbnail?.source || wikiJson?.originalimage?.source;
              if (thumb && !seenUrls.has(thumb)) {
                seenUrls.add(thumb);
                collected.push({ src: thumb, title: wikiJson.title || scientificName });
              }
            }
          } catch (_) {}
        }

        const slots = [];
        for (let i = 0; i < 4; i++) slots.push(collected[i] || null);
        return slots;
      }

            source: "유치환 · 「깃발」"
          },
          {
            quote: "이른 봄 냇가\n버들강아지 보송보송\n따뜻한 햇살을 머금네",
            source: "이은상 · 「봄처녀」"
          },
          {
            quote: "담쟁이덩굴 푸른 잎\n오래된 벽돌담을 따라\n한 걸음씩 올라가네",
            source: "도종환 · 「담쟁이」"
          },
          {
            quote: "가을산 능선 따라\n붉고 노란 단풍잎\n바람결에 춤을 추네",
            source: "김광균 · 「추일서정」"
          },
          {
            quote: "물안개 피어오르는\n이른 아침 호숫가\n갈대잎이 흔들리네",
            source: "정지용 · 「호수」"
          },
          {
            quote: "한여름 소나기 지난 뒤\n파초 잎사귀 위로\n반짝이는 물방울들",
            source: "바쇼 · 「파초」"
          },
          {
            quote: "겨울 햇살 비치는\n창가 화분 속\n선인장 꽃망울이 영글어가네",
            source: "김남조 · 「겨울 바다」"
          },
          {
            quote: "언덕 위 자작나무\n하얀 껍질 빛내며\n바람에 잎새를 흔드네",
            source: "세르게이 예세닌 · 「자작나무」"
          },
          {
            quote: "무성한 덩굴장미\n담장 위로 쏟아지며\n초여름의 향기를 전하네",
            source: "알프레드 테니슨 · 「장미 정원」"
          },
          {
            quote: "해 질 녘 숲속\n키 큰 삼나무 사이로\n붉은 노을이 스며드네",
            source: "요사 부손 · 「봄밤」"
          },
          {
            quote: "논둑길 따라 핀\n달개비 파란 꽃잎\n아침 이슬에 젖어 있네",
            source: "신경림 · 「농무」"
          },
          {
            quote: "산바람 불어오는\n고갯마루 찔레꽃\n하얀 꽃송이가 피어났네",
            source: "박목월 · 「찔레꽃」"
          },
          {
            quote: "푸른 잔디밭 위에\n점점이 내려앉은\n민들레 노란 꽃송이",
            source: "월트 휘트먼 · 「풀잎」"
          },
          {
            quote: "가을비 내리는 오후\n은행잎 노랗게 물들어\n땅 위로 사뿐히 내려앉네",
            source: "김소월 · 「가을 저녁」"
          },
          {
            quote: "숲속 옹달샘 곁\n푸른 이끼 융단 위\n작은 꽃잎이 떨어지네",
            source: "윤극영 · 「반달」"
          },
          {
            quote: "봄바람 살랑이는\n강둑의 유채꽃밭\n노란 물결이 출렁이네",
            source: "김영랑 · 「오월」"
          },
          {
            quote: "깊은 산 계곡물\n맑은 소리 내며 흐르고\n단풍잎 한 장 떠가네",
            source: "이규보 · 「계곡」"
          },
          {
            quote: "아침 햇살 머금은\n상수리나무 잎사귀\n초록빛으로 반짝이네",
            source: "문정희 · 「상수리나무」"
          },
          {
            quote: "바람 자는 저녁\n들판의 쑥부쟁이\n보랏빛으로 고개 들네",
            source: "도종환 · 「옥수수 밭에 누워」"
          },
          {
            quote: "한겨울 눈밭 속\n푸름을 잃지 않은\n동백나무 잎사귀",
            source: "서정주 · 「겨울 하늘」"
          },
          {
            quote: "초여름 저녁바람\n보리 이삭 스치며\n은은한 풀내음을 전하네",
            source: "신석정 · 「초여름」"
          },
          {
            quote: "햇살 고운 언덕\n나팔꽃 보랏빛 덩굴\n울타리를 감고 오르네",
            source: "가노 나고 · 「나팔꽃」"
          },
          {
            quote: "가을 하늘 아래\n감나무 가지마다\n붉은 감이 익어가네",
            source: "박두진 · 「가을」"
          },
          {
            quote: "이른 새벽 들길\n풀잎 끝마다 맺힌\n맑은 이슬방울들",
            source: "정지용 · 「새벽」"
          },
          {
            quote: "산마루 소나무\n거센 바람 맞서며\n푸른 기상을 펼치네",
            source: "조지훈 · 「고풍의상」"
          },
          {
            quote: "봄날의 따스한 햇살\n매화 가지 끝마다\n하얀 꽃봉오리가 맺히네",
            source: "퇴계 이황 · 「도산십이곡」"
          },
          {
            quote: "여름 햇살 쏟아지는\n연못 위 수련 꽃잎\n물결 위에 곱게 피네",
            source: "클로드 모네 · 「수련」"
          },
          {
            quote: "가을바람 스치는\n들녘의 갈대 이삭\n하얀 솜털로 피어나네",
            source: "김춘수 · 「갈대」"
          },
          {
            quote: "숲길 모퉁이에서\n마주친 산수국\n연보랏빛으로 피어 있네",
            source: "노천명 · 「산수국」"
          },
          {
            quote: "비 그친 뒤의 숲\n촉촉한 흙냄새와 함께\n새순들이 반짝이네",
            source: "메리 올리버 · 「비 온 뒤」"
          },
          {
            quote: "늦가을 낙엽 쌓인\n숲속 오솔길을 걸으며\n계절의 발소리를 듣네",
            source: "헤르만 헤세 · 「가을」"
          },
          {
            quote: "봄볕 아래 피어난\n할미꽃 굽은 허리\n작은 생명의 인사를 건네네",
            source: "김남조 · 「봄」"
          },
          {
            quote: "강가 수양버들\n길게 늘어진 가지가\n봄바람에 춤추네",
            source: "두목 · 「강남춘」"
          },
          {
            quote: "초가을 밤하늘 아래\n들국화 향기 스미고\n풀벌레 소리가 이어지네",
            source: "서정주 · 「가을 밤」"
          },
          {
            quote: "한겨울 햇살 받은\n남천 열매 붉게 익어\n눈밭 속에서 빛나네",
            source: "박목월 · 「겨울」"
          },
          {
            quote: "푸른 언덕 위\n바람에 흔들리는\n이름 모를 들풀들",
            source: "윌리엄 워즈워스 · 「들풀」"
          }
        ];
        if (!window.__botanicalPoemQueue || window.__botanicalPoemQueue.length === 0) {
          const indices = poems.map((_, idx) => idx);
          for (let i = indices.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [indices[i], indices[j]] = [indices[j], indices[i]];
          }
          if (window.__botanicalLastPoemIdx !== undefined && indices.length > 1 && indices[0] === window.__botanicalLastPoemIdx) {
            [indices[0], indices[indices.length - 1]] = [indices[indices.length - 1], indices[0]];
          }
          window.__botanicalPoemQueue = indices;
        }
        const nextPoemIdx = window.__botanicalPoemQueue.shift();
        window.__botanicalLastPoemIdx = nextPoemIdx;
        const pickedPoem = poems[Math.floor(Math.random() * poems.length)];
        if (poemQuoteEl) poemQuoteEl.textContent = pickedPoem.quote;
        if (poemSourceEl) poemSourceEl.textContent = "— " + pickedPoem.source;

        loadingText.textContent = '낙엽 밟으며 식물을 판정하는 중...';
        overlay.classList.add('active');
        playLeafRustleSound();
        try {
          const [dateText, locationText, plantInfo] = await Promise.all([
            state.settings.recordDate ? Promise.resolve(formatNowKorean()) : Promise.resolve(''),
            state.settings.recordLocation ? getCurrentLocationText() : Promise.resolve(''),
            identifyPlantWithGemini(apiKey, imagePack.base64, imagePack.mimeType)
          ]);
          loadingText.textContent = '대표 식물 사진과 비교하는 중...';
          const refPhotos = await fetchReferencePhotos(plantInfo.scientificName, plantInfo.englishName, plantInfo.nameKo);
          const remainMs = Math.max(0, minHoldUntil - Date.now());
          if (remainMs > 0) {
            await new Promise((resolve) => setTimeout(resolve, remainMs));
          }
          state.analysisResult = { ...plantInfo, dateText, locationText };
          state.referencePhotos = refPhotos;
          state.view = 'result';
          render();
        } catch (err) {
          const remainMs = Math.max(0, minHoldUntil - Date.now());
          if (remainMs > 0) {
            await new Promise((resolve) => setTimeout(resolve, remainMs));
          }
          showAlertModal('판정 오류', err.message || '식물 정보를 불러오지 못했어요. API 키와 네트워크를 확인해 주세요.');
        } finally {
          overlay.classList.remove('active');
        }
      }

      window.__setBotanicalUserName = function(nextName) {
        const trimmed = (nextName || "").trim();
        state.settings = { ...(state.settings || {}), userName: trimmed, namePromptShown: true };
        render();
      };
      function render() {
        const topTitle = document.getElementById('topTitle');
        const headerActions = document.getElementById('headerActions');
        const mainContent = document.getElementById('mainContent');
        const tabMap = { browse: 'tabBrowse', result: 'tabBrowse', notebook: 'tabNotebook', detail: 'tabNotebook', settings: 'tabSettings' };
        document.querySelectorAll('.tab-btn').forEach((btn) => btn.classList.toggle('active', btn.id === tabMap[state.view]));
        headerActions.innerHTML = '';

        const isSheetView = state.view === 'notebook' || state.view === 'detail' || state.view === 'settings';
        if (isSheetView) {
          topTitle.textContent = '찾아보기';
          renderBrowseView(mainContent);

          const overlay = ensureBottomSheetDom();
          const sheetTitle = document.getElementById('bottomSheetTitle');
          const sheetActions = document.getElementById('bottomSheetHeaderActions');
          const sheetBody = document.getElementById('bottomSheetBody');
          sheetActions.innerHTML = '';

          if (state.view === 'notebook') {
            const cleanName = (state.settings && state.settings.userName || "").trim();
            sheetTitle.textContent = cleanName ? `${cleanName}의 잎사귀 노트` : '잎사귀 노트';
            renderNotebookHeaderActions(sheetActions);
            renderNotebookView(sheetBody);
          } else if (state.view === 'detail') {
            sheetTitle.textContent = '나의 식물 일기';
            const backBtn = document.createElement('button');
            backBtn.type = 'button';
            backBtn.className = 'btn-ghost';
            backBtn.textContent = '목록으로';
            backBtn.addEventListener('click', () => { state.view = 'notebook'; render(); });
            sheetActions.appendChild(backBtn);
            renderDetailView(sheetBody);
          } else if (state.view === 'settings') {
            sheetTitle.textContent = '설정';
            renderSettingsView(sheetBody);
          }

          overlay.classList.add('open');
          return;
        }

        closeBottomSheet();
        if (state.view === 'browse') {
          topTitle.textContent = '찾아보기';
          renderBrowseView(mainContent);
        } else if (state.view === 'result') {
          topTitle.textContent = '알아보기';
          renderResultView(mainContent);
        }
      }

      function renderBrowseView(container) {
        container.innerHTML = `
          <div class="capture-hero">
            <div class="preview-frame" id="previewFrame">
              ${
                state.previewUrl
                  ? `<img src="${escapeAttr(state.previewUrl)}" alt="선택한 식물 사진" />`
                  : `<div class="preview-placeholder">잎, 꽃, 풀, 나무를 촬영하거나<br/>앨범에서 사진을 골라보세요.</div>`
              }
            </div>
            <div class="capture-buttons">
              <button type="button" class="btn-primary" id="btnCamera"><span>카메라 찍기</span></button>
              <button type="button" class="btn-secondary" id="btnAlbum"><span>앨범 올리기</span></button>
            </div>
          </div>
          <div class="info-card">
            <h3>어떤 식물인지 확인하고 기록해요</h3>
            <p>카메라로 식물을 찍거나 사진을 올리면 AI가 이름과 학명, 특징을 알려줘요.<br />대표 사진 4장과 함께 비교해보세요.<br />차곡차곡 쌓인 노트는 나만의 식물도감이 됩니다.</p>
          </div>
        `;
        document.getElementById('btnCamera').addEventListener('click', () => { ensureAudioContext(); document.getElementById('cameraInput').click(); });
        document.getElementById('btnAlbum').addEventListener('click', () => { ensureAudioContext(); document.getElementById('albumInput').click(); });
      }

      function renderResultView(container) {
        const res = state.analysisResult;
        if (!res) { state.view = 'browse'; render(); return; }
        const metaBadges = [];
        if (state.settings.recordDate && res.dateText) metaBadges.push(`<span class="meta-badge">날짜 · ${escapeHtml(res.dateText)}</span>`);
        if (state.settings.recordLocation && res.locationText) metaBadges.push(`<span class="meta-badge">위치 · ${escapeHtml(res.locationText)}</span>`);
        const refHtml = state.referencePhotos.map((item, idx) => item && item.src
          ? `<div class="ref-tile"><img src="${escapeAttr(item.src)}" alt="${escapeAttr(item.title || `비교 사진 ${idx + 1}`)}" loading="lazy" /></div>`
          : `<div class="ref-tile">비교 사진<br/>없음</div>`).join('');

        container.innerHTML = `
          <div class="info-card" style="display:flex;flex-direction:column;gap:12px;">
            <img class="result-photo" src="${escapeAttr(state.previewUrl)}" alt="촬영 또는 업로드한 식물 사진" />
            ${metaBadges.length ? `<div class="meta-strip">${metaBadges.join('')}</div>` : ''}
            <div>
              <h3 class="plant-name-ko">${escapeHtml(res.nameKo)}</h3>
              <div class="plant-name-la">${escapeHtml(res.scientificName)}</div>
              <p class="plant-desc">${escapeHtml(res.description)}</p>
            </div>
          </div>
          <div class="info-card">
            <h3>식물 대표 사진 비교</h3>
            <div class="ref-grid">${refHtml}</div>
          </div>
          <div class="action-row">
            <button type="button" class="btn-secondary" id="btnBackToBrowse">돌아가기</button>
            <button type="button" class="btn-primary" id="btnSaveRecord" ${res.saved ? 'disabled' : ''}>${res.saved ? '기록 완료' : '기록하기'}</button>
          </div>
        `;

        document.getElementById('btnBackToBrowse').addEventListener('click', () => { state.view = 'browse'; render(); });
        const saveBtn = document.getElementById('btnSaveRecord');
        saveBtn.addEventListener('click', async () => {
          if (res.saved || saveBtn.disabled) return;
          res.saved = true;
          saveBtn.disabled = true;
          saveBtn.textContent = '기록 완료';
          try {
            const entry = {
              id: `plant_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
              createdAt: Date.now(),
              photoDataUrl: state.previewUrl,
              nameKo: res.nameKo,
              scientificName: res.scientificName,
              description: res.description,
              dateText: state.settings.recordDate ? (res.dateText || formatNowKorean()) : '',
              locationText: state.settings.recordLocation ? (res.locationText || '') : '',
              referencePhotos: state.referencePhotos,
              comments: []
            };
            await saveEntryToDB(entry);
            state.entries = await fetchAllEntries();
            showAlertModal('기록되었습니다', '잎사귀 노트에서 다시 볼 수 있습니다.');
          } catch (err) {
            res.saved = false;
            saveBtn.disabled = false;
            saveBtn.textContent = '기록하기';
            showAlertModal('저장 오류', err.message || '기록 저장 중 문제가 발생했어요.');
          }
        });
      }

      function renderNotebookHeaderActions(container) {
        if (!state.entries.length) return;
        const toggleBtn = document.createElement('button');
        toggleBtn.type = 'button';
        toggleBtn.className = state.deleteMode ? 'btn-ghost danger' : 'btn-ghost';
        toggleBtn.textContent = state.deleteMode ? '취소' : '삭제';
        toggleBtn.addEventListener('click', () => { state.deleteMode = !state.deleteMode; state.selectedIds.clear(); render(); });
        container.appendChild(toggleBtn);
      }

      function renderNotebookView(container) {
        if (!state.entries.length) {
          container.innerHTML = `<div class="empty-state"><p style="margin:0 0 6px;font-weight:700;color:var(--green-deep);">아직 기록된 식물이 없어요</p><p style="margin:0;font-size:13.5px;">어떤 식물인지 찾아보고 기록하기를 눌러<br />나만의 식물도감을 만들어봐요.</p></div>`;
          return;
        }
        let html = state.deleteMode
          ? `<div class="delete-bar"><span>선택됨: ${state.selectedIds.size}개</span><div style="display:flex;gap:8px;"><button type="button" class="btn-secondary" id="btnSelectAll">${state.entries.length && state.selectedIds.size === state.entries.length ? '전체 해제' : '전체선택'}</button><button type="button" class="btn-danger" id="btnConfirmDelete">선택 삭제</button></div></div>`
          : '';
        const tiles = state.entries.map((item) => {
          const checked = state.selectedIds.has(item.id) ? 'checked' : '';
          return `<div class="diary-thumb" data-id="${escapeAttr(item.id)}"><img src="${escapeAttr(item.photoDataUrl)}" alt="${escapeAttr(item.nameKo)}" loading="lazy" />${state.deleteMode ? `<input type="checkbox" class="diary-check" data-check-id="${escapeAttr(item.id)}" ${checked} />` : ''}</div>`;
        }).join('');
        html += `<div class="diary-grid">${tiles}</div>`;
        container.innerHTML = html;

        if (state.deleteMode) {
          container.querySelectorAll('.diary-check').forEach((chk) => {
            chk.addEventListener('click', (e) => {
              e.stopPropagation();
              const id = chk.getAttribute('data-check-id');
              if (chk.checked) state.selectedIds.add(id); else state.selectedIds.delete(id);
              render();
            });
          });
          const selectAllBtn = document.getElementById('btnSelectAll');
          if (selectAllBtn) {
            selectAllBtn.addEventListener('click', () => {
              const allIds = state.entries.map((item) => item.id);
              const isAllSelected = allIds.length > 0 && allIds.every((id) => state.selectedIds.has(id));
              state.selectedIds.clear();
              if (!isAllSelected) {
                allIds.forEach((id) => state.selectedIds.add(id));
              }
              render();
            });
          }
          const confirmBtn = document.getElementById('btnConfirmDelete');
          if (confirmBtn) {
            confirmBtn.addEventListener('click', async () => {
              if (!state.selectedIds.size) { showAlertModal('안내', '삭제할 식물을 먼저 선택해 주세요.'); return; }
              await deleteEntriesFromDB(Array.from(state.selectedIds));
              state.entries = await fetchAllEntries();
              state.deleteMode = false;
              state.selectedIds.clear();
              render();
            });
          }
        }

        container.querySelectorAll('.diary-thumb').forEach((tile) => {
          tile.addEventListener('click', () => {
            const id = tile.getAttribute('data-id');
            if (state.deleteMode) {
              if (state.selectedIds.has(id)) state.selectedIds.delete(id); else state.selectedIds.add(id);
              render();
              return;
            }
            state.selectedEntryId = id;
            state.view = 'detail';
            render();
          });
        });
      }

      function renderDetailView(container) {
        const entry = state.entries.find((item) => item.id === state.selectedEntryId);
        if (!entry) { state.view = 'notebook'; render(); return; }
        const metaBadges = [];
        if (entry.dateText) metaBadges.push(`<span class="meta-badge">날짜 · ${escapeHtml(entry.dateText)}</span>`);

        return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

<script id="photo-empty-box-script">
  (function () {
    function paintPhotoGuideArea() {
      const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
      let textNode;
      while ((textNode = walker.nextNode())) {
        if (textNode.nodeValue && textNode.nodeValue.includes("잎, 꽃, 풀, 나무를 촬영하거나")) {
          const textEl = textNode.parentElement;
          if (!textEl) break;
          textEl.classList.add("photo-empty-text-fill");

          let cur = textEl;
          let dashedBox = null;
          for (let i = 0; i < 4 && cur && cur !== document.body; i++) {
            const cs = getComputedStyle(cur);
            const hasBorder = (parseFloat(cs.borderTopWidth) > 0 || cs.borderStyle === "dashed" || cs.borderStyle === "dotted");
            if (hasBorder) {
              dashedBox = cur;
              break;
            }
            cur = cur.parentElement;
          }

          const targetBox = dashedBox || textEl.parentElement;
          if (targetBox && targetBox !== document.body) {
            targetBox.classList.add("photo-empty-box-fill");
            if (targetBox.parentElement && targetBox.parentElement !== document.body) {
              targetBox.parentElement.classList.add("photo-empty-card-fill");
            }
          }
          break;
        }
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", paintPhotoGuideArea);
    } else {
      paintPhotoGuideArea();
    }
    setTimeout(paintPhotoGuideArea, 150);
    setTimeout(paintPhotoGuideArea, 600);
  })();
</script>


<script id="meta-pill-bg-script">
  (function () {
    function paintMetaPills() {
      const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
      let node;
      while ((node = walker.nextNode())) {
        const txt = node.nodeValue || "";
        if (txt.includes("날짜 ·") || txt.includes("위치 ·")) {
          const textEl = node.parentElement;
          if (!textEl || textEl === document.body) continue;
          textEl.classList.add("meta-pill-inner");
          textEl.style.setProperty("color", "#1D2242", "important");

          let pillEl = textEl;
          let cur = textEl;
          for (let i = 0; i < 5 && cur && cur !== document.body && cur.id !== "root"; i++) {
            const cs = getComputedStyle(cur);
            const radius = parseFloat(cs.borderRadius) || 0;
            const bg = cs.backgroundColor || "";
            if (radius >= 8 || (bg && bg !== "rgba(0, 0, 0, 0)" && bg !== "transparent")) {
              pillEl = cur;
              break;
            }
            cur = cur.parentElement;
          }

          pillEl.classList.add("meta-pill-box");
          pillEl.style.setProperty("background-color", "#F4F5FD", "important");
          pillEl.style.setProperty("border-color", "#E2E5F7", "important");
          pillEl.style.setProperty("color", "#1D2242", "important");
        }
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", paintMetaPills);
    } else {
      paintMetaPills();
    }
    setTimeout(paintMetaPills, 150);
    setTimeout(paintMetaPills, 600);
  })();
</script>

        "<div id=\"bottomSheetCard\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"bottomSheetTitle\">" +

        "</div>";
      const parent = document.body || document.documentElement;
      if (parent) parent.appendChild(overlay);

      overlay.addEventListener("click", (e) => {
        if (e.target === overlay && typeof closeSheetNow === "function") closeSheetNow();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && overlay.classList.contains("open") && typeof closeSheetNow === "function") {

        e.stopPropagation();

<script id="user-name-feature-script">
  (function () {
    const SETTINGS_KEY = "botanical_note_settings_v1";

    function readSettings() {
      try {
        let raw = null; try { raw = localStorage.getItem(SETTINGS_KEY); } catch (e) {}
        const parsed = raw ? JSON.parse(raw) : {};
        return {
          recordDate: parsed.recordDate !== false,
          recordLocation: parsed.recordLocation !== false,
          userName: typeof parsed.userName === "string" ? parsed.userName.trim() : "",
          namePromptShown: !!parsed.namePromptShown
        };
      } catch (_) {
        return { recordDate: true, recordLocation: true, userName: "", namePromptShown: false };
      }
    }

    function syncAppSettingsState(next) {
      try {
        if (typeof state === "object" && state) {
          state.settings = { ...(state.settings || {}), ...next };
        }
      } catch (_) {}
    }

    function writeUserName(name) {
      const next = { ...readSettings(), userName: (name || "").trim(), namePromptShown: true };
      try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(next)); } catch (e) {}
      syncAppSettingsState(next);
      if (typeof window.__setBotanicalUserName === "function") window.__setBotanicalUserName(next.userName);
      const titleEl = document.getElementById("bottomSheetTitle");
      if (titleEl && (titleEl.textContent || "").includes("잎사귀 노트")) {
        titleEl.textContent = next.userName ? `${next.userName}의 잎사귀 노트` : "잎사귀 노트";
      }
    }

    function syncNotebookTitle() {
      const cur = readSettings();
      syncAppSettingsState(cur);
      const titleEl = document.getElementById("bottomSheetTitle");
      if (!titleEl) return;
      const txt = titleEl.textContent || "";
      if (txt === "잎사귀 노트" || txt.endsWith("의 잎사귀 노트")) {
        titleEl.textContent = cur.userName ? `${cur.userName}의 잎사귀 노트` : "잎사귀 노트";
      }
    }

    function openNameModal() {
      if (document.getElementById("welcomeNameModal")) return;
      const backdrop = document.createElement("div");
      backdrop.id = "welcomeNameModal";
      backdrop.style.cssText =
        "position:fixed;inset:0;z-index:1300;background:rgba(24,30,46,0.5);" +
        "display:flex;align-items:center;justify-content:center;padding:20px;";
      backdrop.innerHTML =
        "<div style=\"width:100%;max-width:340px;background:#FFFFFF;border-radius:20px;" +
        "padding:22px 20px;box-shadow:0 14px 36px rgba(24,30,46,0.22);\">" +
          "<div style=\"font-size:17px;font-weight:700;color:#1f2a24;margin-bottom:6px;\">이름을 알려주세요</div>" +
          "<div style=\"font-size:13.5px;color:#5c6b62;line-height:1.5;margin-bottom:14px;\">입력한 이름으로 나만의 잎사귀 노트를 꾸며드릴게요.</div>" +
          "<input type=\"text\" id=\"welcomeNameInput\" maxlength=\"24\" placeholder=\"이름 입력 (선택)\" " +
          "style=\"width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #d9dfd6;" +
          "border-radius:12px;font-size:14px;margin-bottom:14px;color:#1f2a24;background:#f6f3ea;\" />" +
          "<button type=\"button\" id=\"welcomeNameConfirmBtn\" style=\"width:100%;padding:11px 16px;" +
          "border:none;border-radius:12px;background:#6E7FE6;color:#FFFFFF;font-size:14px;font-weight:700;cursor:pointer;\">확인</button>" +
        "</div>";
      document.body.appendChild(backdrop);

      const input = document.getElementById("welcomeNameInput");
      const confirmBtn = document.getElementById("welcomeNameConfirmBtn");
      setTimeout(() => input && input.focus(), 50);

      const submit = () => {
        writeUserName(input ? input.value : "");
        backdrop.remove();
      };
      confirmBtn.addEventListener("click", submit);
      input.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") {
          ev.preventDefault();
          submit();
        }
      });
    }

    window.addEventListener("load", () => {
      const cur = readSettings();
      if (!cur.namePromptShown && !cur.userName) {
        /* disabled openNameModal for mobile test */
      }
    });

  })();
</script>
